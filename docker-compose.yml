services:
  netfilter-fix:
    image: alpine
    command: sh -c "echo 0 > /proc/sys/net/bridge/bridge-nf-call-iptables; echo 0 > /proc/sys/net/bridge/bridge-nf-call-ip6tables; echo listo"
    network_mode: host
    privileged: true
    restart: "no"

  servidor-web:
    build: ./servidor
    environment:
      - HSTS=${HSTS:-0}
      - REDIRIGIR=${REDIRIGIR:-0}
    networks: { lab: { ipv4_address: 172.20.0.10 } }

  dns:
    build: ./dns
    networks: { lab: { ipv4_address: 172.20.0.53 } }

  victima:
    build: ./victima
    dns: [172.20.0.53]
    networks: { lab: { ipv4_address: 172.20.0.20 } }

  navegador:
    build: ./navegador
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    dns: [172.20.0.53]
    shm_size: "1gb"
    security_opt: [seccomp:unconfined]
    volumes:
      - ./servidor/ca.crt:/certs/ca.crt:ro
      - ./navegador/importar-ca.sh:/custom-cont-init.d/importar-ca.sh:ro
    ports: ["3000:3000"]
    networks: { lab: { ipv4_address: 172.20.0.21 } }

  atacante:
    build: ./atacante
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.route_localnet=1
    tty: true
    networks: { lab: { ipv4_address: 172.20.0.30 } }
    volumes:
      - ./caplets:/root/caplets:ro
networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
